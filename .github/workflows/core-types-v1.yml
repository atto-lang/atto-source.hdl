name: core/types independent source-level behavior oracle
on:
  pull_request:
    paths:
      - 'core/types.atto'
      - 'src/compiler.mjs'
      - 'tests/core-types-source.test.mjs'
      - 'tests/core-types-matrix-source.test.mjs'
      - 'tests/fixtures/core-types-v1/**'
      - '.github/workflows/core-types-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check exact PR head and Git tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse 'HEAD^{tree}'
      - name: Run freestanding Atto source oracle and mutation controls
        run: |
          set -euo pipefail
          node --test tests/core-types-source.test.mjs tests/core-types-matrix-source.test.mjs
          echo 'CORE_TYPES_SOURCE_ONLY=PASS'
          echo 'CORE_TYPES_COMPILED_GUEST=NOT_EXECUTED_BY_THIS_JOB'
      - name: Preserve evidence boundary
        if: always()
        run: echo 'This workflow runs a strict source-model oracle only; it neither compiles Atto nor proves NativeAOT/Wasm/JIT guest execution.' >> "$GITHUB_STEP_SUMMARY"
  core-types-native-compiler-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head before native compiler execution
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse 'HEAD^{tree}'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Compile unchanged core/types to real SystemVerilog RTL
        run: |
          set -euo pipefail
          node bin/oreslang-hdl.mjs tests/fixtures/core-types-v1/hdl-namespace-positive.atto "$RUNNER_TEMP/types-fragment.sv"
          test -s "$RUNNER_TEMP/types-fragment.sv"
          grep -Fq 'module ores_passthrough' "$RUNNER_TEMP/types-fragment.sv"
          for case in hdl-namespace-duplicate-negative hdl-namespace-late-negative; do
            if node bin/oreslang-hdl.mjs "tests/fixtures/core-types-v1/$case.atto" "$RUNNER_TEMP/rejected-$case.sv" >"$RUNNER_TEMP/$case.stdout" 2>"$RUNNER_TEMP/$case.stderr"; then
              echo "$case unexpectedly lowered to RTL" >&2
              exit 1
            fi
            test ! -f "$RUNNER_TEMP/rejected-$case.sv"
            case "$case" in
              *duplicate*) grep -Fq HDL_NAMESPACE_DUPLICATE "$RUNNER_TEMP/$case.stderr";;
              *late*) grep -Fq HDL_NAMESPACE_HEADER_ORDER "$RUNNER_TEMP/$case.stderr";;
            esac
          done
          echo 'CORE_TYPES_HDL_NAMESPACE_FRAGMENT=EMITTED_RTL'
          # Full signed-i64 library needs distinct boolean, constant and
          # signed-width lowering; no simulation parity is inferred here.
          node bin/oreslang-hdl.mjs core/types.atto "$RUNNER_TEMP/core-types.sv"
          test -s "$RUNNER_TEMP/core-types.sv"
          grep -Eq '^module[[:space:]]' "$RUNNER_TEMP/core-types.sv"
          echo 'CORE_TYPES_HDL_RTL_GENERATED=YES'
      - name: Evidence limitations
        if: always()
        run: echo 'RTL source generation only. Hardware simulation, signed-width equivalence, synthesis and 8 negative guests require separate evidence. Zero actual runner steps means NOT_EXECUTED.' >> "$GITHUB_STEP_SUMMARY"
