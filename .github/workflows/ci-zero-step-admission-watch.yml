name: Atto zero-step CI admission watch

on:
  pull_request:
    paths:
      - '.github/workflows/ci-zero-step-admission-watch.yml'
  schedule:
    - cron: '48 4 * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: Exact source-repository Actions run ID (omit for recent bounded scan)
        type: string
        required: false
        default: ''

# Source repo's own token, Actions read only. No compiler checkout, secrets,
# cross-organization private-source transfer, status writes or auto-merging.
permissions:
  actions: read
  contents: read
jobs:
  report-admission:
    uses: atto-lang/.github/.github/workflows/ci-zero-step-watcher.yml@5b067d3d5ea35f93d8a538a809cb250bd80b2e84
    permissions:
      actions: read
      contents: read
    with:
      run_id: ${{ inputs.run_id || '' }}
