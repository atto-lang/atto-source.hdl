name: Pure Bool RTL and synthesized netlist
on:
  pull_request:
    paths: ['src/boolean_reduction.mjs','bin/oreslang-hdl.mjs','tests/boolean-reduction*','.github/workflows/boolean-reduction.yml']
  push:
    paths: ['src/boolean_reduction.mjs','bin/oreslang-hdl.mjs','tests/boolean-reduction*','.github/workflows/boolean-reduction.yml']
permissions:
  contents: read
jobs:
  native-rtl:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git rev-parse HEAD HEAD^{tree}
          node --version
      - name: Install RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
          iverilog -V
          yosys -V
      - name: Run parser and real RTL/netlist gates
        run: |
          node --test tests/boolean-reduction.test.mjs
          node tests/boolean-reduction-rtl.mjs
          node --test tests/atto-hdl-named-bitxor.test.mjs tests/compiler.test.mjs
