name: hls-intent-preflight
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hls-intent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run bounded standalone preflight tests (not performance benchmarks)
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Rust static HLS intent verifier negative coverage
        run: cargo test --offline --manifest-path tools/hls-intent-preflight/Cargo.toml
      - name: Exact-output differential against retained Python oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_optimization_intent.py examples/bounded_add.intent.json > "$RUNNER_TEMP/hls-python.json"
          cargo run --quiet --offline --manifest-path tools/hls-intent-preflight/Cargo.toml -- examples/bounded_add.intent.json > "$RUNNER_TEMP/hls-rust.json"
          diff -u "$RUNNER_TEMP/hls-python.json" "$RUNNER_TEMP/hls-rust.json"
