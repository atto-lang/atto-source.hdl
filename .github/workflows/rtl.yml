name: HDL bootstrap simulation and synthesis
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulation-and-synthesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install RTL tools (required)
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Run fail-closed compiler tests
        run: npm test
      - name: Simulate and synthesize actual emitted RTL
        run: bash scripts/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdl-evidence
          path: build/
