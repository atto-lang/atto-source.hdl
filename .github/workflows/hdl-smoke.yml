name: Experimental HDL Compiler RTL Verification
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          echo "HDL_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: JavaScript unit and reference-oracle checks
        run: npm test
      - name: Install open RTL tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Compile exact source and compare pinned generated RTL
        run: |
          node bin/oreslang-hdl.mjs tests/fixtures/add8.atto /tmp/oreslang_add8.sv
          node bin/oreslang-hdl.mjs tests/fixtures/add8.ores /tmp/oreslang_add8_legacy.sv
          cmp tests/fixtures/add8.atto tests/fixtures/add8.ores
          cmp /tmp/oreslang_add8.sv /tmp/oreslang_add8_legacy.sv
          diff -u tests/fixtures/add8.generated.sv /tmp/oreslang_add8.sv
          sha256sum /tmp/oreslang_add8.sv
      - name: Exhaustive RTL simulation of 65,536 input pairs
        run: |
          set -o pipefail
          iverilog -g2012 -s tb -o /tmp/oreslang_tb /tmp/oreslang_add8.sv tests/add8_tb.sv
          vvp /tmp/oreslang_tb | tee /tmp/sim.log
          grep -Fx HDL_ADD8_65536_PASS /tmp/sim.log
      - name: Synthesize exact compiler-emitted RTL
        shell: bash
        run: |
          set -euo pipefail
          yosys -Q -T -p 'read_verilog -sv /tmp/oreslang_add8.sv; hierarchy -check -top ores_add8; proc; opt; check -assert; synth -top ores_add8; check -assert; stat' | tee /tmp/yosys-synth.log
      - name: Cross-width RTL differential simulation and synthesis
        shell: bash
        run: |
          set -euo pipefail
          node tests/rtl-matrix.mjs | tee /tmp/rtl-matrix.log
          grep -Fx 'RTL_MATRIX_PASS: 2070 vectors across 30 synthesized designs' /tmp/rtl-matrix.log
      - name: Prove RTL equivalence with Yosys SAT and kill negative mutant
        shell: bash
        run: |
          set -euo pipefail
          node tests/rtl-formal-equivalence.mjs | tee /tmp/rtl-formal.log
          grep -Fx 'HDL_SAT_EQUIVALENCE_PASS: 30 complete-width proofs; 1 mutated RTL counterexample' /tmp/rtl-formal.log
      - name: Record exact-head, job-attempt and tool-version-bound evidence
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node scripts/emit-rtl-evidence.mjs
          cat /tmp/hdl-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oreslang-add8-rtl-provenance
          path: |
            /tmp/oreslang_add8.sv
            /tmp/hdl-evidence.json
            /tmp/rtl-formal.log
            /tmp/rtl-matrix.log
            /tmp/sim.log
            /tmp/yosys-synth.log
          retention-days: 14
