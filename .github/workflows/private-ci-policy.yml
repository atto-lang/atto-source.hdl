name: Private CI reviewed exact-destination policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  private-ci-allowlist-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind policy validation to exact source revision
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Verify critical CODEOWNERS boundaries
        shell: bash
        run: |
          set -euo pipefail
          file=.github/CODEOWNERS
          test -f "$file"
          if grep -Fq '\n' "$file"; then
            echo "CODEOWNERS_INVALID: literal escaped newline" >&2
            exit 1
          fi
          awk '
            /^[[:space:]]*(#|$)/ { next }
            NF != 2 || $1 !~ /^\// || $2 != "@ORESoftware" { bad = 1 }
            $1 == "/.github/workflows/" { workflows++ }
            $1 == "/.github/CODEOWNERS" { owners++ }
            $1 == "/.github/private-ci-approved-repositories.txt" { allowlist++ }
            $1 == "/.github/workflows/private-ci-policy.yml" { policy++ }
            END {
              if (bad || workflows != 1 || owners != 1 || allowlist != 1 || policy != 1) exit 1
            }
          ' "$file"
      - name: Verify exact private CI destination allowlist (no transfer)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-ci-export-policy.mjs
          node --test tests/ci-export-policy.test.mjs
          echo 'POLICY_ONLY: source export is not performed by this workflow'
