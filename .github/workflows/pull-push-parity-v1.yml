name: HDL hardware-scope pull-push refusal gate
on:
  pull_request:
    paths:
      - 'tests/pull-push-hardware-scope.test.mjs'
      - '.github/workflows/pull-push-parity-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse 'HEAD^{tree}'
          git hash-object 'tests/pull-push-hardware-scope.test.mjs'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run RTL compiler reject/positive controls
        run: node --test tests/pull-push-hardware-scope.test.mjs
